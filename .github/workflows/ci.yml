name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    name: End-to-end tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run db:migrate:local
      - run: npm run db:seed:local
      # CI has no .dev.vars: Cloudflare's published Turnstile test keys (always pass) and a throwaway salt.
      - name: Local settings for the E2E run
        run: |
          {
            echo "TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "IP_HASH_SALT=$(openssl rand -hex 32)"
          } > .dev.vars
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, secret-scan]
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations first: they must work with the code that is still live (docs/DEPLOYMENT.md).
      - run: npm run db:migrate:staging
      - run: npm run db:seed:staging
      - run: npm run deploy:staging

  # Waits for a manual approval: give the "production" GitHub environment required reviewers.
  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations first: they must work with the code that is still live (docs/DEPLOYMENT.md).
      - run: npm run db:migrate:production
      - run: npm run db:seed:production
      - run: npm run deploy:production
